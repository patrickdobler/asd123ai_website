name = "asd123-ai"
main = "src/index.js"
compatibility_date = "2023-12-01"

[assets]
binding = "ASSETS"
directory = "dist"
html_handling = "auto-trailing-slash"

[env.production]
name = "asd123-ai"
route = "asd123.ai/*"

[env.development]
name = "asd123-ai-dev"

[[env.production.routes]]
pattern = "asd123.ai/*"
zone_name = "asd123.ai"

[build]
command = "npm run build"