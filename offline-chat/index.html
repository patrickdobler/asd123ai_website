<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chat - Private Browser Chat | ASD123.ai</title>
    <meta name="description" content="Run a private local AI chat in your browser with WebGPU models. Prompts, files, images, and chat history stay on your device.">
    <meta name="keywords" content="local AI chat, WebGPU chat, private chatbot, browser AI, Gemma WebGPU, local LLM">
    <meta name="author" content="ASD123.ai">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="ASD123.ai Local AI Chat">
    <meta property="og:description" content="A private in-browser AI chat that runs local WebGPU models and stores history only on your device.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="index.html">
    <meta property="og:site_name" content="ASD123.ai">
    <meta property="og:locale" content="en_US">
    <link rel="canonical" href="index.html">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <script src="scripts/shared.js"></script>
</head>
<body class="chat-page chat-offline-bundle">
    <a href="#main" class="skip-to-main">Skip to main content</a>

    <div class="aurora-bg"></div>

    <div class="content-wrapper">
<main id="main" class="chat-main" role="main">
            <section class="chat-page-header" aria-labelledby="chat-title">
                <div class="chat-page-copy">
                    <h1 id="chat-title" class="page-title">Local AI Chat</h1>
                    <div class="chat-page-subtitle-row">
                        <p class="page-subtitle">
                            Private WebGPU chat with local model execution. Prompts, uploads, generated text, and history stay on this device.
                        </p>
                        <span class="title-badge chat-local-badge">
                            <svg class="badge-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            100% Local
                        </span>
                    </div>
                </div>
                <div class="chat-offline-theme" aria-label="Theme">
                    <span class="chat-offline-theme-label">Theme</span>
                    <label class="toggle-switch" style="transform: scale(0.8);">
                        <input type="checkbox" id="theme-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </section>

            <section class="chat-shell" aria-label="Local AI chat">
                <aside class="chat-sidebar" aria-label="Chat history">
                    <div class="chat-sidebar-actions">
                        <button id="newChatBtn" type="button" class="btn btn-primary btn-small">
                            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14"/>
                                <path d="M5 12h14"/>
                            </svg>
                            New Chat
                        </button>
                    </div>

                    <div id="chatHistory" class="chat-history" role="list"></div>

                    <button id="deleteAllBtn" type="button" class="btn btn-ghost btn-small chat-delete-all">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                        Delete All Chats
                    </button>
                </aside>

                <div class="chat-workspace">
                    <div class="chat-toolbar" aria-label="Chat settings">
                        <div class="chat-toolbar-title">
                            <span id="currentChatTitle">New Chat</span>
                            <small id="modelStatus">Ready</small>
                        </div>

                        <div class="chat-controls-row">
                            <div class="chat-settings-grid">
                                <label class="chat-setting">
                                    <span>Model</span>
                                    <select id="modelSelect" class="select-field"></select>
                                </label>

                                <label class="chat-setting">
                                    <span>Context</span>
                                    <select id="contextSelect" class="select-field"></select>
                                </label>

                                <label class="chat-setting chat-temp-setting">
                                    <span>Temperature <strong id="temperatureValue">0.7</strong></span>
                                    <input id="temperatureInput" type="range" min="0" max="1.5" step="0.1" value="0.7">
                                </label>
                            </div>

                            <div class="chat-toolbar-actions">
                                <button id="stopBtn" type="button" class="btn btn-ghost btn-small chat-stop-btn" hidden>
                                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                                    </svg>
                                    Stop
                                </button>
                                <button id="exportChatBtn" type="button" class="btn btn-secondary btn-small">
                                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="7 10 12 15 17 10"/>
                                        <line x1="12" x2="12" y1="15" y2="3"/>
                                    </svg>
                                    Export MD
                                </button>
                                <button id="loadModelBtn" type="button" class="btn btn-secondary btn-small">
                                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 2v10"/>
                                        <path d="m16 6-4-4-4 4"/>
                                        <path d="M20 16.5A4.5 4.5 0 0 1 15.5 21h-7A4.5 4.5 0 0 1 4 16.5"/>
                                    </svg>
                                    Load Model
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="messageList" class="chat-message-list" aria-live="polite"></div>

                    <div class="chat-composer" aria-label="Message composer">
                        <div id="attachmentList" class="chat-attachment-list"></div>
                        <div class="chat-composer-row">
                            <button id="attachBtn" type="button" class="chat-icon-btn chat-attach-btn" aria-label="Attach files" title="Attach files">
                                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 1 1-2.83-2.83l8.49-8.48"/>
                                </svg>
                            </button>
                            <textarea id="messageInput" rows="1" placeholder="Message local AI..." aria-label="Message local AI"></textarea>
                            <button id="sendBtn" type="button" class="btn btn-primary chat-send-btn">
                                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m22 2-7 20-4-9-9-4Z"/>
                                    <path d="M22 2 11 13"/>
                                </svg>
                                Send
                            </button>
                        </div>
                        <div id="contextBudget" class="chat-context-budget" aria-live="polite">
                            <span class="chat-context-budget__bar" aria-hidden="true">
                                <span id="contextBudgetFill"></span>
                            </span>
                            <span id="contextBudgetText">0% context used</span>
                        </div>
                        <input id="fileInput" type="file" accept="image/*,.txt,.md,.markdown,.pdf,.docx" multiple hidden>
                        <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
                    </div>
                </div>
            </section>
        </main>
</div>

    <script>window.asd123OfflineBundle = true;</script>
    <script src="vendor/ort-wasm-paths.js"></script>
    <script src="vendor/ort.webgpu.bundle.iife.js"></script>
    <script src="vendor/transformers.iife.js"></script>
    <script src="scripts/chat-offline-bundle.js"></script>
</body>
</html>
